name: GWTC correctness
on:
  push:
    branches: ["agent/gwtc-issues-implementation-20261014"]
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "protocols/**"
      - "requirements.txt"
      - ".github/workflows/gwtc-tests.yml"
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Unit and regression tests
        run: python -m pytest -q --basetemp=.pytest_tmp
